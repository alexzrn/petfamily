{{define "layout"}}<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetFamily — админка</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1c1e21; }
    header { background: #1f3d2b; color: #fff; padding: 12px 20px; display: flex; gap: 20px; align-items: center; }
    header a { color: #cfe8d8; text-decoration: none; }
    header a:hover { color: #fff; }
    main { padding: 20px; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e3e6ea; font-size: 14px; }
    th { background: #eef1f4; }
    .cards { display: flex; gap: 16px; flex-wrap: wrap; }
    .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; padding: 16px 20px; min-width: 140px; }
    .card b { display: block; font-size: 26px; margin-top: 6px; }
    form { display: inline; }
    button { cursor: pointer; border: 1px solid #c6ccd4; background: #fff; border-radius: 6px; padding: 4px 10px; }
    .blocked { color: #b00020; font-weight: 600; }
  </style>
</head>
<body>
<header>
  <strong>PetFamily</strong>
  <a href="/">Сводка</a>
  <a href="/users">Пользователи</a>
  <a href="/walks">Прогулки</a>
  <a href="/meetups">Встречи</a>
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>{{end}}
