apiVersion: apps/v1
kind: Deployment
metadata:
  name: petfamily-api
  namespace: petfamily
  labels:
    app: petfamily-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: petfamily-api
  template:
    metadata:
      labels:
        app: petfamily-api
    spec:
      containers:
        - name: api
          image: ghcr.io/alexzrn/petfamily-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: petfamily-db
                  key: MYSQL_DSN
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: petfamily-api
  namespace: petfamily
spec:
  selector:
    app: petfamily-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: petfamily-api-node
  namespace: petfamily
spec:
  type: NodePort
  selector:
    app: petfamily-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
