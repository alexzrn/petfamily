apiVersion: apps/v1
kind: Deployment
metadata:
  name: petfamily-admin
  namespace: petfamily
  labels:
    app: petfamily-admin
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: petfamily-admin
  template:
    metadata:
      labels:
        app: petfamily-admin
    spec:
      containers:
        - name: admin
          image: ghcr.io/alexzrn/petfamily-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: LISTEN_ADDR
              value: ":8081"
            - name: ADMIN_BASE_PATH
              value: "/admin"
            - name: MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: petfamily-db
                  key: MYSQL_DSN
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: petfamily-admin
                  key: ADMIN_USER
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: petfamily-admin
                  key: ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: petfamily-admin
  namespace: petfamily
spec:
  selector:
    app: petfamily-admin
  ports:
    - port: 80
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: petfamily-admin-node
  namespace: petfamily
spec:
  type: NodePort
  selector:
    app: petfamily-admin
  ports:
    - port: 80
      targetPort: 8081
      nodePort: 30081
